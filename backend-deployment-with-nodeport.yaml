apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: todo-backend:1.0       # use the image you built
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort                # Expose backend to host for testing
  selector:
    app: backend
  ports:
    - port: 8000                # inside-cluster port
      targetPort: 8000          # container port
      nodePort: 30080           # fixed port on your host
